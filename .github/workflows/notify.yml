name: Notifiche Telegram

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Invia un messaggio di prova su Telegram'
        type: boolean
        default: false
      weekly:
        description: 'Invia subito riepilogo e backup settimanali (prova)'
        type: boolean
        default: false

concurrency:
  group: notifiche
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installa dipendenze
        working-directory: notifier
        run: npm install --omit=dev

      - name: Controlla e invia notifiche
        working-directory: notifier
        env:
          TEST_MESSAGE: ${{ inputs.test }}
          WEEKLY_TEST: ${{ inputs.weekly }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FIREBASE_UID: ${{ secrets.FIREBASE_UID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node notify.js 